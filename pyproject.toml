[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalab"
version = "0.1.0"
description = "Range-and-repair triage for paired human antibody variable domains"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
evalab = "antibody_prescreen.__main__:main"

[tool.setuptools]
packages = ["antibody_prescreen", "antibody_prescreen.calibration", "antibody_prescreen.structure"]

[tool.setuptools.package-data]
antibody_prescreen = ["data/*.json", "structure/vendor/**"]
