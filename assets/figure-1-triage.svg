<text class="lvl" x="824" y="306" text-anchor="middle" fill="#cf7f70">L4</text>
<text class="lname" x="824" y="323" text-anchor="middle" fill="#3d5266">Human decision</text>
<text class="tick" x="216" y="375" text-anchor="end">strongly unusual</text>
<text class="tick" x="216" y="389" text-anchor="end">(p99–p99.9)</text>
<rect x="232" y="346" width="127" height="61" rx="7" fill="#f2efdc" stroke="#b5a465" stroke-width="1.4"/>
<text class="lvl" x="296" y="372" text-anchor="middle" fill="#b5a465">L2</text>
<text class="lname" x="296" y="389" text-anchor="middle" fill="#3d5266">Point repair</text>
