<text class="lname" x="692" y="455" text-anchor="middle" fill="#3d5266">Out of range</text>
<rect x="760" y="412" width="127" height="61" rx="7" fill="#eed4dd" stroke="#b06a86" stroke-width="1.4"/>
<text class="lvl" x="824" y="438" text-anchor="middle" fill="#b06a86">L5</text>
<text class="lname" x="824" y="455" text-anchor="middle" fill="#3d5266">Out of range</text>
<text class="rule" x="40" y="518"><tspan font-weight="700">Candidate level = max(level of its findings).</tspan> Not a sum, not a weighted average — a person needs the largest price they could pay.</text>
<rect x="40" y="538" width="490" height="88" rx="9" fill="#f7fafc" stroke="#c3d3df"/>
<text class="note" x="60" y="562" font-weight="700" fill="#2b4257">Read a cell as a sentence</text>
<text class="note" x="60" y="583">“typical, but sits in a CDR” → L2: fix it, re-measure affinity.</text>
<text class="note" x="60" y="603">“outside any known range, one framework edit away” → L3, not L5.</text>
<rect x="550" y="538" width="470" height="88" rx="9" fill="#f7fafc" stroke="#c3d3df"/>
<text class="note" x="570" y="562" font-weight="700" fill="#2b4257">What the levels are not</text>
<text class="note" x="570" y="583">L5 is “outside the range with no repair path”, not “bad antibody”.</text>
<text class="note" x="570" y="603">Rank within a level using affinity, yield, SEC, Tm — not these flags.</text>
</svg>