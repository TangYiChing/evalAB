<text class="lname" x="824" y="257" text-anchor="middle" fill="#3d5266">Human decision</text>
<text class="tick" x="216" y="309" text-anchor="end">unusual</text>
<text class="tick" x="216" y="323" text-anchor="end">(p95–p99)</text>
<rect x="232" y="280" width="127" height="61" rx="7" fill="#e8f2e4" stroke="#7aa06a" stroke-width="1.4"/>
